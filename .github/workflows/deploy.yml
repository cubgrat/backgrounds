name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Клонируем репозиторий
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Настраиваем Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 3. Сборка сайта (копируем все файлы)
      - name: Build site
        run: |
          mkdir -p _site
          # Копируем всё из корня репозитория в _site, включая скрытые файлы
          shopt -s dotglob
          cp -r * _site/

      # 4. Загружаем артефакт для Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 5. Деплой на GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
