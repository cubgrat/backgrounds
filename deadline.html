<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Прогресс дедлайна</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
}

.container {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

/* Фон */
.background {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  transition: filter 0.3s;
}

/* Темы */
.theme-light .background {
  filter: brightness(0.9);
}

.theme-dark .background {
  filter: brightness(0.5);
}

/* Центрирование контента */
.wrapper {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
  flex-direction: column;
  gap: 30px;
}

/* Карточка прогресса */
.progress-card {
  width: 90%;
  max-width: 400px;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  background: var(--card-bg);
  color: var(--card-text);
  padding: 30px;
  text-align: center;
}

.title {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 12px;
  color: var(--card-text);
}

.progress-text {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 16px;
  color: var(--card-text);
  opacity: 0.9;
}

.days-grid {
  display: grid;
  grid-template-columns: repeat(52, 1fr);
  gap: 2px;
  margin: 20px 0;
  padding: 20px;
  background: var(--grid-bg);
  border-radius: 8px;
}

.day {
  aspect-ratio: 1;
  background: var(--day-empty);
  border-radius: 2px;
  transition: all 0.2s;
}

.day.passed {
  background: var(--day-passed);
}

.day.current {
  background: var(--day-current);
  box-shadow: 0 0 4px var(--day-current);
}

/* Переменные тем */
.theme-light {
  --card-bg: #ffffff;
  --card-text: #000000;
  --grid-bg: #f0f0f0;
  --day-empty: #e0e0e0;
  --day-passed: #e53935;
  --day-current: #e53935;
}

.theme-dark {
  --card-bg: #1e1e1e;
  --card-text: #ffffff;
  --grid-bg: #2e2e2e;
  --day-empty: #444444;
  --day-passed: #ff5252;
  --day-current: #ff5252;
}
</style>
</head>
<body>

<div id="app" class="container theme-dark">
  <div id="bg" class="background"></div>

  <div class="wrapper">
    <div class="progress-card">
      <div class="title" id="title" style="display: none;"></div>
      <div class="progress-text" id="progress-text"></div>
      <div class="days-grid" id="days-grid"></div>
    </div>
  </div>
</div>

<script>
/* Утилиты */
function getQueryParam(name) {
  const params = new URLSearchParams(window.location.search);
  return params.get(name);
}

function generateRandomSeed() {
  return Math.random().toString(36).substring(2, 12) + Date.now();
}

function formatDate(date) {
  const months = [
    "Января","Февраля","Марта","Апреля","Мая","Июня",
    "Июля","Августа","Сентября","Октября","Ноября","Декабря"
  ];
  return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
}

function formatTimeRemaining(days, hours, minutes) {
  if (days < 0) return "Событие прошло";
  if (days > 0) return `${days} ${days === 1 ? 'день' : days < 5 ? 'дня' : 'дней'}`;
  if (hours > 0) return `${hours} ${hours === 1 ? 'час' : hours < 5 ? 'часа' : 'часов'}`;
  return `${minutes} ${minutes === 1 ? 'минута' : minutes < 5 ? 'минуты' : 'минут'}`;
}

/* Тема */
const theme = getQueryParam("theme");
const app = document.getElementById("app");

if (theme === "0") {
  app.className = "container theme-light";
} else {
  app.className = "container theme-dark";
}

/* Фоновая картинка */
const width = getQueryParam("width") || "1920";
const height = getQueryParam("height") || "1080";
const seed = generateRandomSeed();
const imageUrl = `https://picsum.photos/seed/${seed}/${width}/${height}`;

const bg = document.getElementById("bg");
bg.style.backgroundImage = `url("${imageUrl}")`;

/* Параметры дедлайна */
const deadlineStr = getQueryParam("deadline");
const titleParam = getQueryParam("title");
const daysGrid = document.getElementById("days-grid");
const titleElement = document.getElementById("title");
const progressTextElement = document.getElementById("progress-text");

if (titleParam) {
  titleElement.textContent = decodeURIComponent(titleParam);
  titleElement.style.display = "block";
}

if (!deadlineStr) {
  progressTextElement.textContent = "0%";
  for (let i = 0; i < 365; i++) {
    const day = document.createElement("div");
    day.className = "day";
    daysGrid.appendChild(day);
  }
} else {
  const deadline = new Date(deadlineStr + "T23:59:59");
  const now = new Date();
  
  function updateProgress() {
    const now = new Date();
    const startDate = new Date(deadline.getFullYear(), 0, 1); // Начало года
    const total = deadline - startDate;
    const elapsed = now - startDate;
    const totalDays = Math.ceil(total / (1000 * 60 * 60 * 24));
    const daysPassed = Math.floor(elapsed / (1000 * 60 * 60 * 24));
    const currentDay = daysPassed;
    
    // Вычисляем процент прогресса
    let progress = 0;
    if (totalDays > 0) {
      progress = Math.max(0, Math.min(100, (daysPassed / totalDays) * 100));
    }
    if (now > deadline) {
      progress = 100;
    }
    
    progressTextElement.textContent = `${progress.toFixed(1)}%`;
    
    daysGrid.innerHTML = "";
    
    // Создаем сетку для всех дней от начала года до дедлайна
    for (let i = 0; i < totalDays; i++) {
      const day = document.createElement("div");
      day.className = "day";
      
      if (i < daysPassed) {
        day.classList.add("passed");
      } else if (i === currentDay && now <= deadline) {
        day.classList.add("current");
      }
      
      daysGrid.appendChild(day);
    }
  }
  
  updateProgress();
  setInterval(updateProgress, 86400000); // Обновление раз в день
}
</script>

</body>
</html>
