<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Случайные обои</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: Arial, sans-serif;
}

.container {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

/* Фон */
.background {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
</style>
</head>
<body>

<div class="container">
  <div id="bg" class="background"></div>
</div>

<script>
/* Утилиты */
function getQueryParam(name) {
  const params = new URLSearchParams(window.location.search);
  return params.get(name);
}

function generateRandomSeed() {
  // Используем дату для ежедневного обновления
  const today = new Date();
  const dateStr = today.toISOString().split('T')[0]; // YYYY-MM-DD
  return dateStr + Math.random().toString(36).substring(2, 8);
}

/* Фоновая картинка */
const width = getQueryParam("width") || "1920";
const height = getQueryParam("height") || "1080";
const seed = generateRandomSeed();
const imageUrl = `https://picsum.photos/seed/${seed}/${width}/${height}`;

const bg = document.getElementById("bg");
bg.style.backgroundImage = `url("${imageUrl}")`;
</script>

</body>
</html>
