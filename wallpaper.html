<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Случайные обои</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: Arial, sans-serif;
}
.container {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>

<div class="container">
  <canvas id="canvas"></canvas>
</div>

<script>
/* Утилиты */
function getQueryParam(name) {
  const params = new URLSearchParams(window.location.search);
  return params.get(name);
}

function generateRandomSeed() {
  // Используем дату для ежедневного обновления
  const today = new Date();
  const dateStr = today.toISOString().split('T')[0]; // YYYY-MM-DD
  return dateStr + Math.random().toString(36).substring(2, 8);
}

/* Параметры */
const width = parseInt(getQueryParam("width") || "1920");
const height = parseInt(getQueryParam("height") || "1080");
const seed = generateRandomSeed();

/* Canvas и рендер */
const canvas = document.getElementById('canvas');
canvas.width = width;
canvas.height = height;
const ctx = canvas.getContext('2d');

/* Загрузка фонового изображения */
const img = new Image();
img.crossOrigin = "anonymous";
img.src = `https://picsum.photos/seed/${seed}/${width}/${height}`;
img.onload = () => {
  // Рисуем фон
  ctx.drawImage(img, 0, 0, width, height);

  // Здесь можно добавить прогресс или любые элементы поверх фона
  // Пример: красный прямоугольник 100x100px в левом верхнем углу
  // ctx.fillStyle = "#ff5252";
  // ctx.fillRect(20, 20, 100, 100);

  // Финальное изображение в base64 для Shortcuts
  const finalUrl = canvas.toDataURL("image/png");
  document.body.dataset.finalUrl = finalUrl;
};
</script>

</body>
</html>
