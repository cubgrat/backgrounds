<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Случайный пейзаж</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    .background {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: brightness(0.6);
    }

    .text {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: clamp(24px, 5vw, 64px);
      font-weight: bold;
      text-align: center;
      text-shadow: 0 4px 12px rgba(0,0,0,0.7);
      padding: 20px;
      pointer-events: none;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

<div class="container">
  <div id="bg" class="background"></div>
  <div id="text" class="text" style="display: none;"></div>
</div>

<script>
  function getQueryParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  // Генерируем полностью случайный seed
  function generateRandomSeed() {
    return Math.random().toString(36).substring(2, 12) + Date.now();
  }

  const randomSeed = generateRandomSeed();
  const imageUrl = `https://picsum.photos/seed/${randomSeed}/2560/1440`;

  // Устанавливаем фон
  const bg = document.getElementById("bg");
  bg.style.backgroundImage = `url("${imageUrl}")`;

  // Читаем текст из ?q=
  const q = getQueryParam("q");
  const textBlock = document.getElementById("text");

  if (q && q.trim() !== "") {
    textBlock.textContent = q;
    textBlock.style.display = "flex";
  }
</script>

</body>
</html>
