<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Random Landscape Calendar - Главная</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  background: #1e1e1e;
  color: #fff;
  transition: background 0.3s, color 0.3s;
}

.container {
  background: #2e2e2e;
  padding: 30px;
  border-radius: 14px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.3);
  width: 340px;
  text-align: center;
  transition: background 0.3s, color 0.3s;
}

h1 {
  font-size: 20px;
  margin-bottom: 16px;
}

label {
  display: block;
  margin-top: 12px;
  font-size: 14px;
}

input[type="text"], select {
  width: 100%;
  padding: 8px;
  margin-top: 6px;
  border-radius: 6px;
  border: 1px solid #555;
  background: #3a3a3a;
  color: #fff;
}

button {
  margin-top: 20px;
  padding: 10px;
  font-size: 16px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.3s;
}

#generate {
  background: #e53935;
  color: #fff;
  width: 100%;
}

#generate:hover {
  background: #d32f2f;
}

#theme-toggle {
  background: #555;
  color: #fff;
  width: 100%;
  margin-top: 10px;
}

#theme-toggle:hover {
  background: #777;
}

.output-container {
  margin-top: 16px;
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: center;
}

.output {
  word-break: break-all;
  font-size: 14px;
  flex: 1;
}

.copy-btn {
  padding: 6px 10px;
  border-radius: 6px;
  border: none;
  background: #e53935;
  color: #fff;
  cursor: pointer;
}

.copy-btn:hover {
  background: #d32f2f;
}

.light-theme {
  background: #f5f5f5;
  color: #111;
}

.light-theme .container {
  background: #fff;
  color: #111;
}

.light-theme input[type="text"], .light-theme select {
  background: #eee;
  color: #111;
  border: 1px solid #ccc;
}
</style>
</head>
<body class="dark-theme">

<div class="container">
  <h1>Сгенерировать ссылку на календарь</h1>

  <label for="theme">Тема:</label>
  <select id="theme">
    <option value="1" selected>Тёмная</option>
    <option value="0">Светлая</option>
  </select>

  <label for="text">Текст (опционально):</label>
  <input type="text" id="text" placeholder="Введите текст для календаря">

  <label for="resolution">Устройство / разрешение:</label>
  <select id="resolution">
    <option value="1920x1080">1920x1080 (Full HD)</option>
    <option value="1280x720">1280x720 (HD)</option>
    <option value="1170x2532">iPhone 13</option>
    <option value="1125x2436">iPhone X/XS/11 Pro</option>
    <option value="1080x2340">Android 1080x2340</option>
    <option value="1440x2960">Android 1440x2960</option>
  </select>

  <button id="generate">Сгенерировать ссылку</button>
  <button id="theme-toggle">Переключить тему</button>

  <div class="output-container">
    <div class="output" id="output"></div>
    <button class="copy-btn" id="copy-btn">Копировать</button>
  </div>
</div>

<script>
// Тема
const body = document.body;
const themeSelect = document.getElementById('theme');
const themeToggle = document.getElementById('theme-toggle');
let currentTheme = 'dark';

themeToggle.addEventListener('click', () => {
  if(currentTheme === 'dark') {
    body.classList.add('light-theme');
    body.classList.remove('dark-theme');
    themeSelect.value = '0';
    currentTheme = 'light';
  } else {
    body.classList.remove('light-theme');
    body.classList.add('dark-theme');
    themeSelect.value = '1';
    currentTheme = 'dark';
  }
});

// Автоподстановка разрешения устройства
const resolutionSelect = document.getElementById('resolution');
function detectDeviceResolution() {
  const w = window.screen.width;
  const h = window.screen.height;
  const resStr = `${w}x${h}`;

  // Если есть подходящий вариант в списке — выбираем его
  for (let i = 0; i < resolutionSelect.options.length; i++) {
    if (resolutionSelect.options[i].value === resStr) {
      resolutionSelect.selectedIndex = i;
      return;
    }
  }

  // Если нет — добавляем свой вариант в список
  const option = document.createElement('option');
  option.value = resStr;
  option.textContent = `Ваше устройство (${resStr})`;
  option.selected = true;
  resolutionSelect.appendChild(option);
}
detectDeviceResolution();

// Генерация ссылки
const generateBtn = document.getElementById('generate');
const textInput = document.getElementById('text');
const output = document.getElementById('output');

generateBtn.addEventListener('click', () => {
  const theme = themeSelect.value;
  const text = textInput.value.trim();
  const resolution = resolutionSelect.value;

  let url = window.location.origin + '/calendar.html?theme=' + theme + '&res=' + resolution;
  if(text !== "") {
    url += '&q=' + encodeURIComponent(text);
  }

  output.textContent = url;
});

// Копирование
const copyBtn = document.getElementById('copy-btn');
copyBtn.addEventListener('click', () => {
  if(output.textContent.trim() !== "") {
    navigator.clipboard.writeText(output.textContent).then(() => {
      alert('Ссылка скопирована в буфер обмена');
    });
  }
});
</script>

</body>
</html>
