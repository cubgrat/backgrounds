<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Random Landscape Calendar</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: Arial, sans-serif;
}

.container {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

/* Фон */
.background {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  transition: filter 0.3s;
}

/* Темы */
.theme-light .background {
  filter: brightness(0.9);
}

.theme-dark .background {
  filter: brightness(0.5);
}

/* Центрирование календаря */
.wrapper {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}

/* Календарь */
.calendar {
  width: 340px;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  background: var(--calendar-bg);
  color: var(--calendar-text);
}

/* Заголовок месяца */
.calendar-header {
  background: var(--calendar-header-bg);
  color: var(--calendar-header-text);
  padding: 12px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

/* Год */
.calendar-sub {
  text-align: center;
  padding: 8px;
  font-size: 14px;
  opacity: 0.8;
}


/* Дни недели */
.weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  padding: 0 12px;
  font-size: 12px;
  text-align: center;
  opacity: 0.7;
}

.weekdays div {
  padding: 4px 0;
}

/* Сетка дней */
.days-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  padding: 12px;
}

.day {
  aspect-ratio: 1 / 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--day-bg);
  border-radius: 8px;
  font-size: 14px;
  color: var(--day-text);
}

.today {
  background: var(--today-bg);
  color: var(--today-text);
  font-weight: bold;
  box-shadow: 0 4px 10px rgba(0,0,0,0.4);
}

/* Переменные тем */
.theme-light {
  --calendar-bg: #ffffff;
  --calendar-text: #000000;
  --calendar-header-bg: #e53935;
  --calendar-header-text: #ffffff;
  --day-bg: #f0f0f0;
  --day-text: #333333;
  --today-bg: #e53935;
  --today-text: #ffffff;
}

.theme-dark {
  --calendar-bg: #1e1e1e;
  --calendar-text: #ffffff;
  --calendar-header-bg: #444444;
  --calendar-header-text: #ffffff;
  --day-bg: #2e2e2e;
  --day-text: #dddddd;
  --today-bg: #ff5252;
  --today-text: #ffffff;
}
</style>
</head>
<body>

<div id="app" class="container theme-dark">
  <div id="bg" class="background"></div>

  <div class="wrapper">
    <div class="calendar">
      <div id="month" class="calendar-header"></div>
      <div id="info" class="calendar-sub"></div>

      <div class="weekdays">
        <div>Пн</div>
        <div>Вт</div>
        <div>Ср</div>
        <div>Чт</div>
        <div>Пт</div>
        <div>Сб</div>
        <div>Вс</div>
      </div>

      <div id="days" class="days-grid"></div>
    </div>
  </div>
</div>

<script>
/* Утилиты */
function getQueryParam(name) {
  const params = new URLSearchParams(window.location.search);
  return params.get(name);
}

function generateRandomSeed() {
  return Math.random().toString(36).substring(2, 12) + Date.now();
}

/* Тема */
const theme = getQueryParam("theme");
const app = document.getElementById("app");

if (theme === "0") {
  app.className = "container theme-light";
} else {
  app.className = "container theme-dark";
}

/* Фоновая картинка */
const width = getQueryParam("width") || "1920";
const height = getQueryParam("height") || "1080";
const seed = generateRandomSeed();
const imageUrl = `https://picsum.photos/seed/${seed}/${width}/${height}`;

const bg = document.getElementById("bg");
bg.style.backgroundImage = `url("${imageUrl}")`;

/* Календарь */
const now = new Date();

const year = now.getFullYear();
const month = now.getMonth();
const today = now.getDate();

const months = [
  "Январь","Февраль","Март","Апрель","Май","Июнь",
  "Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"
];

document.getElementById("month").textContent = months[month];
document.getElementById("info").textContent = year;

/* Количество дней в месяце */
const daysInMonth = new Date(year, month + 1, 0).getDate();

/* День недели первого числа (Пн = 0) */
let firstDay = new Date(year, month, 1).getDay();
firstDay = firstDay === 0 ? 6 : firstDay - 1;

const daysContainer = document.getElementById("days");

/* Пустые ячейки */
for (let i = 0; i < firstDay; i++) {
  const empty = document.createElement("div");
  daysContainer.appendChild(empty);
}

/* Дни месяца */
for (let day = 1; day <= daysInMonth; day++) {
  const cell = document.createElement("div");
  cell.className = "day";
  cell.textContent = day;

  if (day === today) {
    cell.classList.add("today");
  }

  daysContainer.appendChild(cell);
}
</script>

</body>
</html>
